name: stitchdb_postgrest
description: PostgREST client for Dart. This library provides an ORM interface to PostgREST.
version: 1.0.0
homepage: 'https://stitchdb.com/docs/sdk/flutter'
repository: 'https://github.com/stitchdb/stitchdb-flutter'
issue_tracker: 'https://github.com/stitchdb/stitchdb-flutter/issues'
documentation: 'https://stitchdb.com/docs/sdk/flutter'
topics:
  - stitchdb
  - postgrest
  - database
  - orm
  - api

environment:
  sdk: '>=3.9.0 <4.0.0'

resolution: workspace

dependencies:
  http: ^1.6.0
  yet_another_json_isolate: 2.1.1
  meta: ^1.16.0
  logging: ^1.3.0
  stitchdb_common: ^1.0.0

dev_dependencies:
  collection: ^1.19.0
  stitchdb_lints: ^1.0.0
  test: ^1.25.0

false_secrets:
  - /test/**
