name: stitchdb
description: A dart client for StitchDB. This client makes it simple for developers to build secure and scalable products.
version: 1.0.0
homepage: 'https://stitchdb.com/docs/sdk/flutter'
repository: 'https://github.com/stitchdb/stitchdb-flutter'
issue_tracker: 'https://github.com/stitchdb/stitchdb-flutter/issues'
documentation: 'https://stitchdb.com/docs/sdk/flutter'
topics:
  - stitchdb
  - backend
  - database
  - auth
  - api

environment:
  sdk: '>=3.9.0 <4.0.0'

resolution: workspace

dependencies:
  stitchdb_functions: ^1.0.0
  stitchdb_auth: ^1.0.0
  http: ^1.6.0
  meta: ^1.7.0
  stitchdb_postgrest: ^1.0.0
  stitchdb_realtime: ^1.0.0
  stitchdb_storage: ^1.0.0
  stitchdb_common: ^1.0.0
  yet_another_json_isolate: 2.1.1
  logging: ^1.3.0

dev_dependencies:
  stitchdb_lints: ^1.0.0
  test: ^1.25.0
  web_socket_channel: '>=3.0.0 <4.0.0'