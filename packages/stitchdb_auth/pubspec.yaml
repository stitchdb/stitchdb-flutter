name: stitchdb_auth
description: A dart client library for the StitchDB Auth API.
version: 1.0.0
homepage: 'https://stitchdb.com/docs/sdk/flutter'
repository: "https://github.com/stitchdb/stitchdb-flutter"
issue_tracker: 'https://github.com/stitchdb/stitchdb-flutter/issues'
documentation: 'https://stitchdb.com/docs/sdk/flutter'
topics:
  - stitchdb
  - auth
  - authentication
  - backend
  - api

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  collection: ^1.19.0
  crypto: ^3.0.7
  http: ^1.6.0
  meta: ^1.16.0
  logging: ^1.3.0
  stitchdb_common: ^1.0.0
  web: ">=1.0.0 <2.0.0"
  dart_jsonwebtoken: ">=3.0.0 <4.0.0"

dev_dependencies:
  cryptography: ^2.9.0
  dotenv: ^4.2.0
  stitchdb_lints: ^1.0.0
  test: ^1.25.0
  otp: ^3.2.0

false_secrets:
  - /test/**
