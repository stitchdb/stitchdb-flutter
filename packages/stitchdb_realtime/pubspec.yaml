name: stitchdb_realtime
description: Listens to changes in a PostgreSQL Database and via websockets. This is for usage with StitchDB Realtime server.
version: 1.0.0
homepage: 'https://stitchdb.com/docs/sdk/flutter'
repository: 'https://github.com/stitchdb/stitchdb-flutter'
issue_tracker: 'https://github.com/stitchdb/stitchdb-flutter/issues'
documentation: 'https://stitchdb.com/docs/sdk/flutter'
topics:
  - stitchdb
  - realtime
  - websocket
  - database
  - backend

environment:
  sdk: '>=3.9.0 <4.0.0'

resolution: workspace

dependencies:
  collection: ^1.19.0
  http: ^1.6.0
  logging: ^1.3.0
  meta: ^1.16.0
  stitchdb_common: ^1.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  stitchdb_lints: ^1.0.0
  mocktail: ^1.0.5
  postgres: ^3.5.0
  test: ^1.25.0
  crypto: ^3.0.7
