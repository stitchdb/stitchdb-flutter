name: stitchdb_flutter
description: Flutter integration for StitchDB. This package makes it simple for developers to build secure and scalable products.
version: 1.0.0
homepage: 'https://stitchdb.com/docs/sdk/flutter'
repository: 'https://github.com/stitchdb/stitchdb-flutter'
issue_tracker: 'https://github.com/stitchdb/stitchdb-flutter/issues'
documentation: 'https://stitchdb.com/docs/sdk/flutter'
topics:
  - stitchdb
  - flutter
  - backend
  - auth
  - database

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

resolution: workspace

dependencies:
  app_links: '>=6.4.1 <8.0.0'
  async: ^2.12.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  meta: ^1.16.0
  passkeys_platform_interface: ^2.8.0
  stitchdb: ^1.0.0
  stitchdb_common: ^1.0.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  logging: ^1.3.0
  web: '>=1.0.0 <2.0.0'

dev_dependencies:
  dart_jsonwebtoken: ">=3.0.0 <4.0.0"
  flutter_test:
    sdk: flutter
  stitchdb_lints: ^1.0.0
  web_socket_channel: '>=3.0.0 <4.0.0'

platforms:
  android:
  ios:
  macos:
  web:
  windows:
  linux:

flutter:
